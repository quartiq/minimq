[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mqtt-staging"
# Note: keep this in sync with Cargo.toml
version = "0.1.1"
description = "Stage bounded objects into embedded storage over MQTT"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
authors = [{ name = "Robert Jördens", email = "rj@quartiq.de" }]
dependencies = ["gmqtt>=0.7,<0.8"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["ruff>=0.11"]

[project.urls]
Repository = "https://github.com/quartiq/minimq.git"

[project.scripts]
mqtt-staging = "mqtt_staging:main"

[tool.setuptools]
py-modules = ["mqtt_staging"]

[tool.ruff]
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
